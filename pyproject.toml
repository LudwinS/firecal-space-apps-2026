[project]
name = "firecal"
version = "0.1.0"
description = "InnovaSoft workspace for NASA Space Apps 2026"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.0",
    "fpdf2>=2.9.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
firecal = "firecal:main"

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
