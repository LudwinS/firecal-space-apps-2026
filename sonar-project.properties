# Análisis estático con SonarQube (local: http://localhost:9000). Ver reporte en la carpeta de entregables.
sonar.projectKey=firecal
sonar.projectName=FireCal
sonar.sources=src,web/src
sonar.tests=tests,web/src
sonar.test.inclusions=tests/**,web/src/**/*.test.ts
sonar.exclusions=web/src/**/*.test.ts,web/dist/**,web/node_modules/**,web/coverage/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.sourceEncoding=UTF-8
