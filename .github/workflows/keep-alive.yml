# Mantiene despierta la API en Render (plan gratuito: se duerme tras 15 min sin tráfico y
# tarda ~1 min en volver). Un ping cada 5 minutos evita que un juez o un usuario vea la app "caída".
#
# - Los workflows programados solo corren desde la rama por defecto (main).
# - GitHub puede retrasar las ejecuciones programadas; por eso se usa 5 min y no 10.
# - GitHub desactiva los workflows programados tras 60 días sin actividad en el repo:
#   cualquier commit, o "Run workflow" a mano, lo reactiva.
name: Keep API awake

on:
  schedule:
    - cron: "2-59/5 * * * *" # cada 5 min, fuera del minuto 0 (el más congestionado)
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

env:
  API_URL: https://firecal-api.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        # Si la API estaba dormida, la primera respuesta puede tardar ~1 min: se espera y se reintenta.
        run: |
          curl --fail --silent --show-error --max-time 100 --retry 3 --retry-delay 15 --retry-all-errors \
            "$API_URL/api/health"
      - name: Warm the data (first query after a restart)
        run: |
          curl --fail --silent --show-error --max-time 100 --retry 2 --retry-delay 10 --retry-all-errors \
            --output /dev/null "$API_URL/api/areas"
